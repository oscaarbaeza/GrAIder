[project]
name = "graider"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Óscar Baeza", email = "oscarbverd05@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.33.0",
    "pathlib>=1.0.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
graider = "graider:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
